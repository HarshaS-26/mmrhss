<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | MMRHSS & Sainik School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/gallery.css">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="js/seo.js"></script>
</head>

<body>

    <div id="navbar"></div>

    <section class="gallery-hero">
        <div class="container">
            <div class="gallery-hero-content">
                <span class="section-tag">Moments & Memories</span>
                <h1>Gallery</h1>
                <p>A glimpse into campus life, academics, achievements and student activities.</p>
            </div>
        </div>
    </section>

    <section class="gallery-filter">
        <div class="container">
            <div class="gallery-tabs" id="galleryTabs">
                Loading categories...
            </div>
        </div>
    </section>

    <section class="gallery-section">
        <div class="container">
            <div class="gallery-grid" id="publicGalleryGrid">
                Loading gallery...
            </div>

            <div class="text-center mt-5">
                <button id="loadMoreBtn" class="btn btn-warning px-4 py-2" style="display:none;">
                    Load More
                </button>
            </div>
        </div>
    </section>

    <div id="footer"></div>
    <div class="image-modal" id="imageModal">
        <span class="modal-close" id="modalClose">&times;</span>

        <button class="modal-btn prev" id="prevBtn">&#10094;</button>

        <div class="modal-content-box">
            <img id="modalImage" src="" alt="Gallery Image">

            <div class="modal-caption">
                <h4 id="modalTitle"></h4>
                <p id="modalCategory"></p>
                <span id="modalCounter"></span>
            </div>
        </div>

        <button class="modal-btn next" id="nextBtn">&#10095;</button>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin/js/supabase-config.js"></script>
    <script src="js/gallery-public.js"></script>

    <script>
        const galleryImages = document.querySelectorAll(".gallery-img");
        const imageModal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        const modalClose = document.getElementById("modalClose");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        let currentIndex = 0;

        function showImage(index) {
            currentIndex = index;
            modalImage.src = galleryImages[currentIndex].src;
            imageModal.style.display = "flex";
        }

        galleryImages.forEach((img, index) => {
            img.addEventListener("click", () => {
                showImage(index);
            });
        });

        nextBtn.addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % galleryImages.length;
            showImage(currentIndex);
        });

        prevBtn.addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            showImage(currentIndex);
        });

        modalClose.addEventListener("click", () => {
            imageModal.style.display = "none";
        });

        imageModal.addEventListener("click", (e) => {
            if (e.target === imageModal) {
                imageModal.style.display = "none";
            }
        });

        document.addEventListener("keydown", (e) => {
            if (imageModal.style.display === "flex") {
                if (e.key === "ArrowRight") {
                    nextBtn.click();
                }

                if (e.key === "ArrowLeft") {
                    prevBtn.click();
                }

                if (e.key === "Escape") {
                    imageModal.style.display = "none";
                }
            }
        });
    </script>
</body>

</html>
