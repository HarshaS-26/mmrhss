<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>News & Events | MMRHSS CMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">
            <div class="brand">
                <img src="../assets/images/logo/logo.jpeg" alt="MMRHSS">
                <h4>MMRHSS CMS</h4>
            </div>

            <nav>
                <a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
                <a class="active" href="news.html"><i class="bi bi-newspaper"></i> News & Events</a>
                <a href="gallery.html"><i class="bi bi-images"></i> Gallery</a>
                <a href="enquiries.html">
                    <i class="bi bi-chat-left-text-fill"></i>
                    Enquiries
                </a>
                <!--<a href="#"><i class="bi bi-megaphone-fill"></i> Announcements</a>
                <a href="#"><i class="bi bi-file-earmark-pdf-fill"></i> Circulars</a>-->
            </nav>

            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </aside>

        <main class="content">

            <div class="topbar">
                <div>
                    <!-- <span class="section-tag">Content Management</span>-->
                    <h1>News & Events</h1>
                </div>
            </div>

            <div class="news-admin-grid">

                <div class="admin-card">
                    <h3 id="formTitle">Add News / Event</h3>

                    <form id="newsForm">
                        <input type="hidden" id="news_id">
                        <label>Title</label>
                        <input type="text" id="title" class="form-control" maxlength="50" required>
                        <small class="field-help">Maximum 50 characters</small>

                        <label>Category</label>
                        <select id="category" class="form-control" required>
                            <option value="News">News</option>
                            <option value="Event">Event</option>
                            <option value="Admission">Admission</option>
                            <option value="Achievement">Achievement</option>
                            <option value="Announcement">Announcement</option>
                        </select>

                        <label>Date</label>
                        <input type="date" id="event_date" class="form-control" required>

                        <label>Description</label>
                        <textarea id="description" class="form-control" rows="5" maxlength="200" required></textarea>
                        <small class="field-help">Maximum 200 characters</small>

                        <label>Featured Image</label>
                        <input type="file" id="news_image" class="form-control" accept="image/*">
                        <small class="field-help">Optional. Use a clear landscape photo if available.</small>

                        <div id="imagePreviewBox" class="image-preview-box" style="display:none;">
                            <span>Image Preview</span>
                            <img id="imagePreview" src="" alt="Preview">
                        </div>

                        <!--<label>PDF Link / Page Link</label>
                        <input type="text" id="link_url" class="form-control" placeholder="Optional">-->

                        <label>Status</label>
                        <select id="status" class="form-control">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>

                        <div class="form-buttons">
                            <button type="submit" class="btn-save" id="saveBtn">
                                Publish
                            </button>

                            <button type="button" class="btn-cancel" id="cancelEditBtn">
                                Cancel
                            </button>
                        </div>

                        <p id="formMessage"></p>

                    </form>
                </div>

                <div class="admin-card">
                    <h3>Existing News & Events</h3>

                    <div id="newsList" class="news-list">
                        Loading...
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/idle-timeout.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/news.js"></script>

</body>

</html>
