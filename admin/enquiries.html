<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">

    <title>Enquiries | MMRHSS CMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">

            <div class="brand">
                <img src="../assets/images/logo/logo.jpeg" alt="MMRHSS">
                <h4>MMRHSS CMS</h4>
            </div>

            <nav>
                <a href="dashboard.html">
                    <i class="bi bi-grid-fill"></i>
                    Dashboard
                </a>

                <a href="news.html">
                    <i class="bi bi-newspaper"></i>
                    News & Events
                </a>

                <a href="gallery.html">
                    <i class="bi bi-images"></i>
                    Gallery
                </a>

                <a class="active" href="enquiries.html">
                    <i class="bi bi-chat-left-text-fill"></i>
                    Enquiries
                </a>
            </nav>

            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                Logout
            </button>

        </aside>

        <main class="content">

            <div class="topbar">

                <div>
                    <h1>Enquiries</h1>
                    <p class="text-muted mb-0">
                        View and manage messages received through the contact form.
                    </p>
                </div>

            </div>

            <div class="admin-card">

                <div class="enquiry-toolbar">

                    <select id="statusFilter" class="form-select">
                        <option value="all">All Statuses</option>
                        <option value="unread">Unread</option>
                        <option value="read">Read</option>
                        <option value="closed">Closed</option>
                    </select>

                    <div id="exportButtons"></div>

                    <div id="searchBox"></div>

                </div>

                <div class="table-responsive">

                    <table id="enquiriesTable" class="table table-striped table-hover align-middle w-100">

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Submitted</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody></tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <!-- View Enquiry Modal -->
    <div class="modal fade" id="enquiryModal" tabindex="-1" aria-labelledby="enquiryModalTitle" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="enquiryModalTitle">
                        Enquiry Details
                    </h2>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>

                <div class="modal-body">

                    <div class="enquiry-detail">
                        <span>Name</span>
                        <strong id="modalName">-</strong>
                    </div>

                    <div class="enquiry-detail">
                        <span>Email</span>
                        <a id="modalEmail" href="#">-</a>
                    </div>

                    <div class="enquiry-detail">
                        <span>Phone</span>
                        <a id="modalPhone" href="#">-</a>
                    </div>

                    <div class="enquiry-detail">
                        <span>Submitted</span>
                        <strong id="modalDate">-</strong>
                    </div>

                    <div class="enquiry-message-box">
                        <span>Message</span>
                        <p id="modalMessage"></p>
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-outline-secondary" id="markReadBtn">
                        Mark as Read
                    </button>

                    <button type="button" class="btn btn-outline-success" id="closeEnquiryBtn">
                        Close Enquiry
                    </button>

                    <button type="button" class="btn btn-outline-danger" id="deleteEnquiryBtn">
                        Delete
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/supabase-config.js"></script>
    <script src="js/idle-timeout.js"></script>
    <script src="js/utils.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>

    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

    <script src="js/enquiries.js"></script>

</body>

</html>
