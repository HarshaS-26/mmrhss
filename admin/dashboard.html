<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>MMRHSS CMS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="admin-layout">

    <aside class="sidebar">
        <div class="brand">
            <img src="../assets/images/logo/logo.png" alt="MMRHSS">
            <h4>MMRHSS CMS</h4>
        </div>

        <nav>
            <a class="active" href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
            <a href="news.html"><i class="bi bi-newspaper"></i> News & Events</a>
            <a href="gallery.html"><i class="bi bi-images"></i> Gallery</a>
            <!--<a href="#"><i class="bi bi-megaphone-fill"></i> Announcements</a>
            <a href="#"><i class="bi bi-file-earmark-pdf-fill"></i> Circulars</a>-->
        </nav>

        <button id="logoutBtn" class="logout-btn">
            <i class="bi bi-box-arrow-right"></i> Logout
        </button>
    </aside>

    <main class="content">
        <div class="topbar">
            <div>
                <span class="section-tag">Administration Portal</span>
                <h1>Dashboard</h1>
            </div>
        </div>

        <div class="dashboard-grid">

            <a href="news.html" class="dash-card">
                <i class="bi bi-newspaper"></i>
                <h3>News & Events</h3>
                <p>Add, update and publish school news and event updates.</p>
            </a>

            <a href="gallery.html" class="dash-card">
                <i class="bi bi-images"></i>
                <h3>Gallery</h3>
                <p>Manage school photos, albums and gallery categories.</p>
            </a>

            <!--<a href="#" class="dash-card">
                <i class="bi bi-megaphone-fill"></i>
                <h3>Announcements</h3>
                <p>Control important notices shown on the homepage.</p>
            </a>

            <a href="#" class="dash-card">
                <i class="bi bi-file-earmark-pdf-fill"></i>
                <h3>Circulars</h3>
                <p>Upload admission notices, circulars and PDF documents.</p>
            </a>-->

        </div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
