<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Gallery | MMRHSS CMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="sidebar">
            <div class="brand">
                <img src="../assets/images/logo/logo.jpeg" alt="MMRHSS">
                <h4>MMRHSS CMS</h4>
            </div>

            <nav>
                <a href="dashboard.html"><i class="bi bi-grid-fill"></i> Dashboard</a>
                <a href="news.html"><i class="bi bi-newspaper"></i> News & Events</a>
                <a class="active" href="gallery.html"><i class="bi bi-images"></i> Gallery</a>
                <a href="enquiries.html">
                    <i class="bi bi-chat-left-text-fill"></i>
                    Enquiries
                </a>
                <!--<a href="#"><i class="bi bi-megaphone-fill"></i> Announcements</a>
                <a href="#"><i class="bi bi-file-earmark-pdf-fill"></i> Circulars</a>-->
            </nav>

            <button id="logoutBtn" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </aside>

        <main class="content">

            <div class="topbar">
                <div>
                    <h1>Gallery</h1>
                </div>
            </div>

            <div class="news-admin-grid">

                <div class="admin-card">
                    <h3 id="formTitle">Add Gallery Image</h3>

                    <form id="galleryForm">
                        <input type="hidden" id="gallery_id">

                        <label>Title</label>
                        <input type="text" id="title" class="form-control" maxlength="60" required>
                        <small class="field-help">Maximum 60 characters</small>

                        <label>Category</label>
                        <select id="category" class="form-control" required>
                            <option value="Campus">Campus</option>
                            <option value="Academics">Academics</option>
                            <option value="Sainik">Sainik</option>
                            <option value="Events">Events</option>
                            <option value="Student Life">Student Life</option>
                            <option value="Sports">Sports</option>
                            <option value="Alumni">Alumni</option>
                        </select>

                        <label>Gallery Image</label>
                        <input type="file" id="gallery_image" class="form-control" accept="image/*" multiple>
                        <small class="field-help">
                            You can upload up to <strong>10 images</strong> at once.
                            Maximum file size: <strong>15 MB</strong> per image.
                            Images are automatically compressed before upload.
                        </small>

                        <div id="imagePreviewContainer" class="image-preview-container" style="display:none;">
                            <span>Image Preview</span>
                            <img id="imagePreview" src="" alt="Preview">
                        </div>

                        <label>Status</label>
                        <select id="status" class="form-control">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>

                        <div class="form-buttons">
                            <button type="submit" class="btn-save" id="saveBtn">
                                Publish
                            </button>

                            <button type="button" class="btn-cancel" id="cancelEditBtn">
                                Cancel
                            </button>
                        </div>

                        <p id="formMessage"></p>

                    </form>
                </div>

                <div class="admin-card">
                    <h3>Existing Gallery Images</h3>

                    <div id="galleryList" class="news-list">
                        Loading...
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/idle-timeout.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/gallery.js"></script>

</body>

</html>
